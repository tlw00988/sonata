name: Release

on:
  workflow_call:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libasound2-dev \
            libmpv-dev \
            libsecret-1-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Package AppImage
        run: |
          set -euo pipefail
          bundle=build/linux/x64/release/bundle
          appdir=build/AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir"
          cp -r "$bundle"/. "$appdir"/

          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/sonata" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          cat > "$appdir/sonata.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Sonata
          Comment=Sonata music player for Navidrome / OpenSubsonic
          Exec=sonata
          Icon=sonata
          Terminal=false
          Categories=Audio;AudioVideo;Music;Player;
          EOF

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "$appdir/sonata.png"
          cp "$appdir/sonata.png" "$appdir/.DirIcon"

          wget -q --tries=3 --timeout=60 -O /tmp/appimagetool             https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          /tmp/appimagetool --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun "$appdir" Sonata-linux-x64.AppImage
          rm -rf ./squashfs-root

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-linux-x64
          path: Sonata-linux-x64.AppImage

  build-windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath Sonata-windows-x64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-windows-x64
          path: Sonata-windows-x64.zip

  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Restore keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::Android keystore secrets 未配齐，本次 APK 退回 debug 签名"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "upload-keystore.jks" \
            "$ANDROID_KEYSTORE_PASSWORD" \
            "$ANDROID_KEY_ALIAS" \
            "$ANDROID_KEY_PASSWORD" \
            > android/key.properties
          echo "keystore restored: android/upload-keystore.jks (keyAlias=$ANDROID_KEY_ALIAS)"

      - name: Build APK
        run: flutter build apk --release

      - name: Show APK signer
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK/build-tools" ]; then
            echo "::warning::没找到 Android SDK，跳过签名校验"
            exit 0
          fi
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::找不到 apksigner，跳过签名校验"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ipa --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app Payload/
          zip -qr Sonata.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-ipa
          path: Sonata.ipa

  publish:
    name: Publish GitHub release
    needs:
      - build-linux
      - build-windows
      - build-android
      - build-ios
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Sonata-linux-x64/Sonata-linux-x64.AppImage
            artifacts/Sonata-windows-x64/Sonata-windows-x64.zip
            artifacts/Sonata-android-apk/app-release.apk
            artifacts/Sonata-ipa/Sonata.ipa
