name: Debug Build

# 每次提交都出一份可安装的产物：Windows exe、Linux AppImage、
# Android APK（arm64-v8a + armeabi-v7a 两个单独的包）、iOS IPA。
# 都是 debug 构建，方便对着日志定位是哪次提交引入的问题；
# 要发正式版请打 v* tag 走 Release 工作流。

on:
  push:
    branches:
      # 限成分支：打 v* tag 时 Release 工作流已经会出正式包，
      # 这里再跑一遍纯属重复（on: push 不加分支过滤时 tag 推送也会触发）。
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # 不打 fat apk：按 ABI 拆开，只出 aarch64 与 armv7a 两个。
      - name: Build APK
        run: >
          flutter build apk --debug
          --split-per-abi
          --target-platform=android-arm64,android-arm

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-apk-debug
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --debug

      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Debug/* -DestinationPath Sonata-windows-x64-debug.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-windows-x64-debug
          path: Sonata-windows-x64-debug.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libasound2-dev \
            libmpv-dev \
            libsecret-1-dev \
            squashfs-tools \
            desktop-file-utils

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --debug

      - name: Package AppImage
        run: |
          set -euo pipefail
          bundle=build/linux/x64/debug/bundle
          appdir=build/AppDir
          rm -rf "$appdir"
          mkdir -p "$appdir"
          cp -r "$bundle"/. "$appdir"/

          # AppImage 只要求 AppDir 里有 AppRun + .desktop + 图标。
          # Flutter 的可执行文件靠 /proc/self/exe 找同级的 lib/ 与 data/，
          # 所以 AppRun 直接 exec 同目录下的二进制即可。
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/sonata" "$@"
          EOF
          chmod +x "$appdir/AppRun"

          cat > "$appdir/sonata.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Sonata
          Comment=Sonata music player for Navidrome / OpenSubsonic
          Exec=sonata
          Icon=sonata
          Terminal=false
          Categories=Audio;AudioVideo;Music;Player;
          EOF

          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png "$appdir/sonata.png"
          cp "$appdir/sonata.png" "$appdir/.DirIcon"

          wget -q --tries=3 --timeout=60 -O /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          # appimagetool 本身是个 AppImage，直接跑要挂 FUSE；先解包成普通
          # 文件再通过它的 AppRun 执行（它会把自己带的 mksquashfs 加进 PATH），
          # 这条路不依赖 FUSE 也不依赖 APPIMAGE_EXTRACT_AND_RUN。
          /tmp/appimagetool --appimage-extract >/dev/null
          ARCH=x86_64 ./squashfs-root/AppRun "$appdir" Sonata-linux-x64-debug.AppImage
          rm -rf ./squashfs-root

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-linux-x64-debug
          path: Sonata-linux-x64-debug.AppImage
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # --no-codesign 只出 .xcarchive，没有可直接安装的 ipa；
      # 这里把它重新打包成标准 ipa（Payload/<App>.app 在压缩包根目录），
      # 方便下载后交给 AltStore / TrollStore 等工具签名安装。
      - name: Build iOS
        run: flutter build ipa --debug --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/*.app Payload/
          zip -qr Sonata.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-ipa
          path: Sonata.ipa
          if-no-files-found: error
          retention-days: 14
