name: iOS Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios-test.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ipa --release --no-codesign

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: Sonata-ios-archive
          path: build/ios/archive/Runner.xcarchive
