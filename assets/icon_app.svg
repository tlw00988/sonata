<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="176" height="176" rx="40" fill="url(#bg)"/>

  <!-- Vinyl record -->
  <circle cx="96" cy="96" r="62" fill="#1e1b4b" opacity="0.9"/>
  <circle cx="96" cy="96" r="56" fill="none" stroke="#4338ca" stroke-width="0.8" opacity="0.3"/>
  <circle cx="96" cy="96" r="48" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.25"/>
  <circle cx="96" cy="96" r="40" fill="none" stroke="#4338ca" stroke-width="0.8" opacity="0.3"/>
  <circle cx="96" cy="96" r="32" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.2"/>

  <!-- Center -->
  <circle cx="96" cy="96" r="20" fill="#1e1b4b"/>
  <circle cx="96" cy="96" r="2.5" fill="#e9d5ff"/>

  <!-- Play triangle -->
  <path d="M89 82 L89 110 L112 96 Z" fill="#e9d5ff" opacity="0.95"/>

  <!-- Small music note -->
  <g transform="translate(140, 38) rotate(12)" opacity="0.8">
    <circle cx="0" cy="0" r="5" fill="#e9d5ff"/>
    <rect x="4" y="-16" width="2" height="16" fill="#e9d5ff" rx="1"/>
    <path d="M6 -16 Q14 -22 6 -28" fill="none" stroke="#e9d5ff" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>
