<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc"/>
      <stop offset="100%" style="stop-color:#e9d5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="atop"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.4"/>

  <!-- Vinyl record base -->
  <circle cx="256" cy="256" r="140" fill="#1e1b4b" opacity="0.9"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#312e81" stroke-width="0.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#312e81" stroke-width="0.3" opacity="0.4"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#312e81" stroke-width="0.5" opacity="0.5"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#312e81" stroke-width="0.3" opacity="0.3"/>

  <!-- Vinyl grooves -->
  <circle cx="256" cy="256" r="125" fill="none" stroke="#4338ca" stroke-width="0.8" opacity="0.3"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.25"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#4338ca" stroke-width="0.8" opacity="0.3"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.2"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#4338ca" stroke-width="0.8" opacity="0.25"/>
  <circle cx="256" cy="256" r="75" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.2"/>

  <!-- Center label -->
  <circle cx="256" cy="256" r="48" fill="#1e1b4b"/>
  <circle cx="256" cy="256" r="46" fill="none" stroke="url(#glow)" stroke-width="1" opacity="0.5"/>
  <circle cx="256" cy="256" r="6" fill="url(#glow)"/>

  <!-- Play triangle -->
  <path d="M240 228 L240 284 L290 256 Z" fill="url(#glow)" opacity="0.95"/>

  <!-- Floating music notes -->
  <g opacity="0.85" filter="url(#shadow)">
    <!-- Note 1 - top left -->
    <g transform="translate(100, 110) rotate(-15)">
      <circle cx="0" cy="0" r="10" fill="#e9d5ff"/>
      <rect x="8" y="-30" width="3" height="30" fill="#e9d5ff" rx="1.5"/>
      <path d="M11 -30 Q22 -38 11 -46" fill="none" stroke="#e9d5ff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Note 2 - top right -->
    <g transform="translate(395, 95) rotate(10)">
      <circle cx="0" cy="0" r="8" fill="#c084fc"/>
      <rect x="6" y="-26" width="2.5" height="26" fill="#c084fc" rx="1.2"/>
      <path d="M8.5 -26 Q18 -33 8.5 -40" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Note 3 - bottom left -->
    <g transform="translate(85, 380) rotate(-8)">
      <circle cx="0" cy="0" r="7" fill="#d8b4fe"/>
      <rect x="5" y="-22" width="2" height="22" fill="#d8b4fe" rx="1"/>
      <path d="M7 -22 Q16 -28 7 -34" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Double note - right -->
    <g transform="translate(420, 300) rotate(5)">
      <circle cx="0" cy="0" r="7" fill="#e9d5ff"/>
      <circle cx="24" cy="-4" r="7" fill="#e9d5ff"/>
      <rect x="5" y="-28" width="2.5" height="28" fill="#e9d5ff" rx="1"/>
      <rect x="29" y="-32" width="2.5" height="32" fill="#e9d5ff" rx="1"/>
      <rect x="5" y="-30" width="26" height="3" fill="#e9d5ff" rx="1.5"/>
    </g>
  </g>

  <!-- Sparkle dots -->
  <circle cx="140" cy="180" r="2.5" fill="#e9d5ff" opacity="0.7"/>
  <circle cx="370" cy="160" r="2" fill="#c084fc" opacity="0.6"/>
  <circle cx="160" cy="350" r="2" fill="#d8b4fe" opacity="0.5"/>
  <circle cx="380" cy="370" r="2.5" fill="#e9d5ff" opacity="0.6"/>
  <circle cx="310" cy="120" r="1.5" fill="#c084fc" opacity="0.5"/>
  <circle cx="200" cy="400" r="1.5" fill="#d8b4fe" opacity="0.4"/>
</svg>
