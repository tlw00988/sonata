name: sonata
description: "Sonata, a Flutter music player with Navidrome/OpenSubsonic support"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  
  # Local file metadata (ID3 / Vorbis / MP4 tags, embedded art & lyrics)
  audio_metadata_reader: ^1.8.0
  charset: ^2.0.1

  # Audio playback
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  
  # State management
  provider: ^6.1.2
  
  # HTTP & API
  dio: ^5.4.3
  crypto: ^3.0.3
  
  # Image & color extraction
  palette_generator: ^0.3.3
  cached_network_image: ^4.0.0
  
  # Dynamic color (Material You)
  # 2.x 的 DynamicColorBuilder 交回的是 package:material_ui 的 ColorScheme，
  # 跟 flutter/material 的 ColorScheme 是两个类，没法喂给 ThemeData；
  # 升级需要自己重写一遍 corepalette → ColorScheme 的转换，暂留 1.x。
  dynamic_color: ^1.9.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Permissions
  permission_handler: ^13.0.2
  
  # System media controls (notification, lock screen, MPRIS)
  audio_service: ^0.18.17
  audio_service_win: ^0.0.3
  audio_service_mpris: ^0.2.1
  
  # File handling
  path_provider: ^2.1.2
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true