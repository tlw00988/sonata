name: sonata
description: "Sonata, a Flutter music player with Navidrome/OpenSubsonic support"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  
  # Local file metadata (ID3 / Vorbis / MP4 tags, embedded art & lyrics)
  audio_metadata_reader: ^1.8.0
  charset: ^2.0.1

  # Audio playback
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.9
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_android_video: ^1.3.6
  media_kit_libs_ios_video: ^1.1.4
  media_kit_libs_macos_video: ^1.1.4
  
  # State management
  provider: ^6.1.2
  
  # HTTP & API
  dio: ^5.4.3
  crypto: ^3.0.3
  
  # Image & color extraction
  palette_generator: ^0.3.3
  cached_network_image: ^4.0.0
  
  # Dynamic color (Material You)
  dynamic_color: ^1.7.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Permissions
  permission_handler: ^13.0.2
  
  # System media controls (notification, lock screen, MPRIS)
  audio_service: ^0.18.17
  audio_service_win: ^0.0.3
  audio_service_mpris: ^0.2.1
  
  # File handling
  path_provider: ^2.1.2
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true